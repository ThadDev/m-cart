{% extends "base.html" %}

{% block title %}Create Account — M-Cart{% endblock %}

{% block content %}

<section class="auth-section">

    <div class="auth-container register-container">

        <div class="auth-header">

            <div class="auth-logo">
                <span>M</span>
            </div>

            <p class="eyebrow">GET STARTED</p>

            <h1>
                Create your
                <span>M-Cart</span>
                account.
            </h1>

            <p class="auth-subtitle">
                Join M-Cart and get a better way to shop online.
            </p>

        </div>


        <form method="POST" class="auth-form">

            {% csrf_token %}

           


            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Choose a username"
                    autocomplete="username"
                    required
                >

            </div>


            <div class="form-group">

                <label for="email">
                    Email address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="you@example.com"
                    autocomplete="email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="phone">
                    Phone number
                </label>

                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="+234 800 000 0000"
                    autocomplete="tel"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a strong password"
                    autocomplete="new-password"
                    required
                >

            </div>

            <div class="form-group">

    <label for="password_confirm">
        Confirm password
    </label>

    <input
        type="password"
        id="password_confirm"
        name="password_confirm"
        placeholder="Repeat your password"
        autocomplete="new-password"
        required
    >

</div>


            <button type="submit" class="btn-primary">
                Create account
                <span>→</span>
            </button>

        </form>


        <div class="auth-footer">

            <p>
                Already have an account?
                <a href="{% url 'login' %}">
                    Sign in
                </a>
            </p>

        </div>

    </div>

</section>

{% endblock %}
