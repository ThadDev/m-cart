{% extends "base.html" %}

{% block title %}Sign In — M-Cart{% endblock %}

{% block content %}

<section class="auth-section">

    <div class="auth-container">

        <div class="auth-header">

            <div class="auth-logo">
                <span>M</span>
            </div>

            <p class="eyebrow">WELCOME BACK</p>

            <h1>
                Sign in to
                <span>M-Cart.</span>
            </h1>

            <p class="auth-subtitle">
                Access your account and continue shopping.
            </p>

        </div>


        <form method="POST" class="auth-form">

            {% csrf_token %}



            <div class="form-group">

                <label for="email">
                    Email address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="you@example.com"
                    autocomplete="email"
                    required
                >

            </div>


            <div class="form-group">

                <div class="label-row">

                    <label for="password">
                        Password
                    </label>

                    <a href="#" class="forgot-password">
                        Forgot password?
                    </a>

                </div>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <button type="submit" class="btn-primary">
                Sign in
                <span>→</span>
            </button>

        </form>


        <div class="auth-footer">

            <p>
                Don't have an account?
                <a href="{% url 'register' %}">
                    Create one
                </a>
            </p>

        </div>

    </div>

</section>

{% endblock %}
